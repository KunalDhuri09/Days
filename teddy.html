<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Teddy Day 🧸</title>

<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<script src="https://cdn.lordicon.com/lordicon.js"></script>

<style>
/* 🧸 TEDDY DAY THEME */
html, body {
  width: 100%;
  height: 100%;
}
body {
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at top, #ffb6c1, #2b0a14);
  color: #fff;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}

/* MAIN */
.main {
  width: 100%;
  max-width: 1200px;
  height: 100vh;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  text-align:center;
}

.hero{
  flex:1;
  display:flex;
  flex-wrap:wrap;
  gap:2rem;
  justify-content:center;
  align-items:center;
}

.left,.right{flex:1;min-width:280px}

/* 🧸 QUOTES */
.quote{
  margin:1.2rem auto;
  padding:1.3rem 1.7rem;
  max-width:460px;
  border-radius:22px;
  cursor:pointer;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px);
  transition:.35s;
}
.quote:hover{
  transform:scale(1.05);
  background:rgba(255,182,193,.35);
  box-shadow:0 0 30px rgba(255,105,180,.7);
}
.quote::after{
  content:"🧸 Tap for a warm hug";
  display:block;
  margin-top:.5rem;
  font-size:.75rem;
  opacity:.6;
}

/* 🧸 FLOATING TEDDIES */
.teddy{
  position:fixed;
  bottom:-40px;
  pointer-events:none;
  z-index:999;
  animation:floatUp linear infinite;
}
@keyframes floatUp{
  to{
    transform:translateY(-110vh) rotate(-8deg);
    opacity:0;
  }
}

/* 🎵 START OVERLAY */
#startOverlay{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at top,#ffb6c1,#2b0a14);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3000;
  cursor:pointer;
}
.overlay-content{text-align:center;animation:pulse 1.8s infinite}
@keyframes pulse{
  0%{transform:scale(1);opacity:.8}
  50%{transform:scale(1.08);opacity:1}
  100%{transform:scale(1);opacity:.8}
}

/* 🧸 CARD OVERLAY */
#cardOverlay{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at top,#ff9eb5,#2b0a14);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:2500;
}

/* CARD */
.card{
  max-width:540px;
  padding:2.3rem;
  border-radius:28px;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(14px);
  text-align:center;
  animation:cardIn .6s ease forwards;
}
@keyframes cardIn{
  from{opacity:0;transform:scale(.7)}
  to{opacity:1;transform:scale(1)}
}

/* 🧸 BIG TEDDY */
.big-teddy{
  font-size:92px;
  margin-bottom:1rem;
  animation:pop 1.4s ease-out forwards, float 3s infinite;
}
@keyframes pop{
  from{transform:scale(0) rotate(-180deg);opacity:0}
  to{transform:scale(1) rotate(0);opacity:1}
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-12px)}
}

.back-btn{
  margin-top:1.6rem;
  cursor:pointer;
  opacity:.8;
}

/* 💖 TEDDY BURST */
.teddy-burst{
  position:fixed;
  left:50%;
  top:50%;
  font-size:22px;
  animation:burst 1.2s ease-out forwards;
  pointer-events:none;
}
@keyframes burst{
  from{transform:scale(0);opacity:1}
  to{
    transform:scale(1.4) translate(var(--x),var(--y));
    opacity:0
  }
}
.teddy-day {
  text-align: center;
  padding: 1.5rem;
}

.name {
  font-size: 1.1rem;
  font-weight: 600;
  margin: 0.3rem 0;
}

.teddy-heart {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0.5rem 0;
  animation: pulse 2s infinite;
}

.teddy-heart span {
  font-size: 2.2rem;
}

.teddy-heart small {
  font-size: 0.8rem;
  color: #ff9bb3;
  letter-spacing: 1px;
}

.teddy-line {
  margin-top: 1rem;
  font-size: 0.95rem;
  color: #ffd6e5;
}

.hearts span {
  margin: 0 5px;
  animation: float 3s ease-in-out infinite;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

@keyframes float {
  0% { opacity: 0; transform: translateY(0); }
  50% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-10px); }
</style>
</head>

<body>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" loop>
  <source src="Tik Tik Vajate Dokyat (Film Version) - Full Song - Duniyadari Marathi Movie - Sonu Nigam.mp3" type="audio/mpeg">
</audio>

<!-- START -->
<div id="startOverlay">
  <div class="overlay-content">
    <h2>🧸 Happy Teddy Day 🧸</h2>
    <p>Tap to receive a warm hug 💕</p>
  </div>
</div>

<!-- CARD -->
<div id="cardOverlay">
  <div class="card">
    <div class="big-teddy">🧸</div>
    <h2>Just for You 💖</h2>
    <p id="cardQuote"></p>
    <div class="back-btn" onclick="closeCard()">⬅ Back</div>
  </div>
</div>

<div class="main">
  <h2>* Teddy Day Special *</h2>

  <div class="hero">
<div class="left teddy-day">
  <lord-icon 
    src="https://cdn.lordicon.com/xxdqayua.json"
    trigger="hover"
    style="width:130px;height:130px">
  </lord-icon>

  <p class="name">Kunal</p>

  <div class="teddy-heart">
    <span>🧸</span>
    <small>Happy Teddy Day</small>
  </div>

  <p class="name">Shweta</p>

  <lord-icon 
    src="https://cdn.lordicon.com/qhviklyi.json"
    trigger="hover"
    style="width:130px;height:130px">
  </lord-icon>

  <div class="hearts">
    <span>💖</span><span>💗</span><span>💞</span>
  </div>
</div>


    <div class="right">
      <h3>A teddy hug for my favorite person 🤗</h3>
      <div class="quotes"></div>
    </div>
  </div>
</div>

<script>
/* 🧸 TEDDY MESSAGE */
const quotes=[`
Dear Shweta,

Jar mi ek teddy asato,
tar mi nehmi tujhya shivayach rahilo asto 🧸

Tu hasat asashil tevha tula ghalayla mithit,
tu udaas asashil tevha tula dhir denyasathi,
aani tula nehmi athavnyasathi —
ki tu kadhi ekati nahi ahes 💖

On this Teddy Day,
consider this teddy as a promise
of endless hugs from me 🤗

Always yours,
Kunal 💕
`];

const quotesDiv=document.querySelector(".quotes");
const cardOverlay=document.getElementById("cardOverlay");
const cardQuote=document.getElementById("cardQuote");

quotes.forEach(text=>{
  const p=document.createElement("p");
  p.className="quote";
  p.innerText=text;
  p.onclick=()=>{
    cardQuote.innerText=text;
    cardOverlay.style.display="flex";
    teddyBurst();
  };
  quotesDiv.appendChild(p);
});

function closeCard(){
  cardOverlay.style.display="none";
}

/* 🧸 FLOATING TEDDIES */
function createTeddy(){
  const t=document.createElement("div");
  t.className="teddy";
  t.textContent="🧸";
  t.style.left=Math.random()*100+"vw";
  t.style.fontSize=18+Math.random()*18+"px";
  t.style.animationDuration=5+Math.random()*4+"s";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),9000);
}
setInterval(createTeddy,650);

/* 💖 TEDDY BURST */
function teddyBurst(){
  for(let i=0;i<16;i++){
    const b=document.createElement("div");
    b.className="teddy-burst";
    b.textContent="💖";
    b.style.setProperty("--x",(Math.random()*260-130)+"px");
    b.style.setProperty("--y",(Math.random()*260-130)+"px");
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),1200);
  }
}

/* 🎵 MUSIC */
const music=document.getElementById("bgMusic");
document.getElementById("startOverlay").onclick=()=>{
  music.volume=.25;
  music.play();
  startOverlay.style.display="none";
};
</script>

</body>
</html>
